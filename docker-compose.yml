services:
  app:
    build:
        context: .
        dockerfile: Dockerfile
    ports:
      - "8086:8086"
    container_name: nino_app
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SWAGGER_ENABLED:        "false"
      # true: DB prod da co schema toi V22 duoc apply thu cong truoc khi
      # dung Flyway -> baseline de khong chay lai V1-V22 (xem application.yml)
      FLYWAY_BASELINE:        "true"
    restart: unless-stopped
    networks:
      - shared-network
networks:
  shared-network:
    external: true  
