services:
  app:
    build:
        context: .
        dockerfile: Dockerfile
    ports:
      - "8086:8086"
    container_name: nino_app
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SWAGGER_ENABLED:        "false"
      FLYWAY_BASELINE:        "false"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
    restart: unless-stopped
    networks:
      - shared-network
networks:
  shared-network:
    external: true  
